
name: allkit unsigned ios build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: extract source
        run: |
          unzip -q allkit-source.zip -d source

      - name: install dependencies
        working-directory: source
        run: npm ci

      - name: sync ios
        working-directory: source
        run: npm run sync

      - name: build unsigned iphone app
        working-directory: source
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: package ipa
        working-directory: source
        run: |
          mkdir -p ipa/Payload

          APP_PATH="build/Build/Products/Release-iphoneos/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App.app was not found!"
            exit 1
          fi

          ditto "$APP_PATH" ipa/Payload/App.app

          cd ipa
          zip -qry ../AllKit-unsigned.ipa Payload

      - name: upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: AllKit-unsigned-IPA
          path: source/AllKit-unsigned.ipa
          retention-days: 14
