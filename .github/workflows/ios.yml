
name: allkit ios build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: extract source
        run: |
          unzip -q allkit-source.zip -d source

      - name: install dependencies
        working-directory: source
        run: npm ci

      - name: sync ios
        working-directory: source
        run: npm run sync

      - name: build ios simulator app
        working-directory: source
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: upload build
        uses: actions/upload-artifact@v4
        with:
          name: allkit-ios-build
          path: source/build/Build/Products/Release-iphonesimulator/App.app
